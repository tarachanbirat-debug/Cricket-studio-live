name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Env
        run: |
          touch .env .env.example
          touch app/.env app/.env.example
          
          # Keystore root, app, aur system teeno jagah daal diya taaki kabhi fail na ho
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true
          cp -f debug.keystore ~/.android/debug.keystore 2>/dev/null || true
          
          echo "android.builder.sdkDownload=true" >> gradle.properties
          echo "org.gradle.configuration-cache=false" >> gradle.properties

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --no-configuration-cache -x test -x lint -x check --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cricket-Scorer-APK
          path: app/build/outputs/apk/**/*.apk
