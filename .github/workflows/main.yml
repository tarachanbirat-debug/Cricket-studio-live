name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Pre-build setup (Licenses, Keystore, Env)
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a2b8e44e454045e772e34042784" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses 2>/dev/null || true

          touch .env .env.example
          touch app/.env app/.env.example

          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true

          echo "android.builder.sdkDownload=true" >> gradle.properties
          echo "org.gradle.configuration-cache=false" >> gradle.properties
          echo "googleServices.missing.passthrough=true" >> gradle.properties

      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache -x test -x lint -x check --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --no-configuration-cache -x test -x lint -x check --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cricket-Scorer-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
